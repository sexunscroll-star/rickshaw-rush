<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rickshaw Rush</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b0f2e; overflow: hidden; }
  body { font-variant-numeric: tabular-nums; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; margin: 0 auto; touch-action: none; }
</style>

<body>
<canvas id="game"></canvas>
<script src="config.js"></script>
<script>
'use strict';
// Rickshaw Rush: a 3-lane desi street runner seen from behind. Swipe or tap to change lane,
// dodge cows, cyclists, tempos and buses, pick up passengers for speed and multiplier.
// First crash: slowdown and a traffic-police chase; a second crash during the chase ends the run.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 720, H = 1280;        // logical size: portrait, phone first
const PIXEL = false;
const FONT = "'Trebuchet MS', 'Segoe UI', Verdana, Arial, sans-serif";
const TITLE = 'Rickshaw Rush';
const CONTROLS = ['Swipe or tap left / right: change lane', 'Keyboard: Arrows or A / D', 'Space: horn  ·  P: pause  ·  M: mute'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
let vseed = 99;
function vr() { // visual-only random (particles, shake): never touches gameplay
  vseed = (vseed + 0x6D2B79F5) | 0;
  let t = Math.imul(vseed ^ (vseed >>> 15), vseed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function hash(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const events = [];

// ---- Saved between visits ---------------------------------------------------------------
const store = {
  get(k, d) { try { const v = localStorage.getItem('rickshawRush.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('rickshawRush.' + k, JSON.stringify(v)); } catch (e) { /* storage off */ } },
};
let best = Number(store.get('best', 0)) || 0;

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() { // fills the window at any size and at the device's real pixel ratio (sharp on high-DPI)
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = k;
  const r = s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = true;
  baseTransform = [r, 0, 0, r, 0, 0];
}
let baseTransform = [1, 0, 0, 1, 0, 0];
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center') {
  ctx.fillStyle = c; ctx.font = `${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
const INK = '#2a0f3a';
/** Bold text with a dark outline, the game's lettering. */
function otext(s, x, y, size, fill, align = 'center', stroke = INK, lw = 0.22) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size * lw); ctx.strokeStyle = stroke;
  ctx.strokeText(s, x, y); ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function rrp(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fs(c) { ctx.fillStyle = c; ctx.fill(); ctx.stroke(); }
function ell(x, y, rx, ry, c, stroke) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); if (stroke) ctx.stroke();
}
function line(x0, y0, x1, y1, c, w) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.strokeStyle = c; ctx.lineWidth = w; ctx.stroke(); }
/** A limb or stick: dark outline under a coloured core. */
function limb(x0, y0, x1, y1, c, w) { ctx.lineCap = 'round'; line(x0, y0, x1, y1, INK, w * 1.5); line(x0, y0, x1, y1, c, w); }

// ---- Input: keys by position (event.code), OS key repeat ignored; touch swipes and taps ---
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
addEventListener('blur', () => down.clear());
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
let ptr = null;
canvas.addEventListener('pointerdown', e => {
  startAudio(); e.preventDefault();
  const p = toLogical(e);
  const b = buttons().find(b => Math.hypot(p.x - b.x, p.y - b.y) < b.r + 10);
  if (b) { b.act(); ptr = null; return; }
  ptr = { x0: p.x, y0: p.y, swiped: false };
});
addEventListener('pointermove', e => {
  if (!ptr || ptr.swiped) return;
  const p = toLogical(e), dx = p.x - ptr.x0, dy = p.y - ptr.y0;
  if (Math.abs(dx) > tune.swipeDist && Math.abs(dx) > Math.abs(dy) * 0.8) {
    if (scene === 'play') hit.add(dx < 0 ? 'ArrowLeft' : 'ArrowRight');
    ptr.swiped = true;
  }
});
addEventListener('pointerup', e => {
  if (!ptr) return;
  const p = toLogical(e);
  if (!ptr.swiped) { if (scene === 'play') hit.add(p.x < W / 2 ? 'ArrowLeft' : 'ArrowRight'); else hit.add('Tap'); }
  ptr = null;
});
addEventListener('pointercancel', () => { ptr = null; });
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play') scene = 'pause'; });
/** On-screen buttons for the current scene (pause, mute). */
function buttons() {
  const b = [{ x: W - 50, y: 58, r: 30, kind: 'mute', act: () => setMuted(!muted) }];
  if (scene === 'play') b.push({ x: W - 122, y: 58, r: 30, kind: 'pause', act: () => { scene = 'pause'; } });
  if (scene === 'pause') b.push({ x: W - 122, y: 58, r: 30, kind: 'play', act: () => { scene = 'play'; } });
  return b;
}

// ---- Audio: all made here with Web Audio, started on first input, mute on M --------------
let audio = null, muted = !!store.get('muted', false);
function startAudio() {
  if (!audio) {
    try {
      const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
      const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume; out.connect(ac.destination);
      const music = ac.createGain(); music.gain.value = tune.musicVolume; music.connect(out);
      const nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = nb.getChannelData(0); let ns = 12345;
      for (let i = 0; i < d.length; i++) { ns = (ns * 1103515245 + 12345) & 0x7fffffff; d[i] = ns / 0x3fffffff - 1; }
      // engine: a putt-putt sawtooth, chopped by a square LFO
      const eo = ac.createOscillator(); eo.type = 'sawtooth'; eo.frequency.value = 50;
      const ef = ac.createBiquadFilter(); ef.type = 'lowpass'; ef.frequency.value = 380;
      const eg = ac.createGain(); eg.gain.value = 0;
      const lfo = ac.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 9;
      const lg = ac.createGain(); lg.gain.value = 0;
      lfo.connect(lg); lg.connect(eg.gain); eo.connect(ef); ef.connect(eg); eg.connect(out); eo.start(); lfo.start();
      audio = { ac, out, music, nb, eo, eg, lg, lfo };
    } catch (e) { audio = null; return; }
  }
  if (audio.ac.state === 'suspended' && audio.ac.resume) audio.ac.resume();
}
function setMuted(m) { muted = m; store.set('muted', m); if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => { setMuted(muted); if (audio) audio.music.gain.value = tune.musicVolume; });
function tone(freq, dur, type = 'square', vol = 0.3) { if (audio && !muted) osc(type, freq, audio.ac.currentTime, dur, vol); }
function osc(type, f, t0, dur, vol, dest, f2) {
  const a = audio.ac, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || audio.out); o.start(t0); o.stop(t0 + dur + 0.03); return o;
}
function noise(t0, dur, vol, ftype, freq, dest, q) {
  const a = audio.ac, src = a.createBufferSource(); src.buffer = audio.nb;
  const f = a.createBiquadFilter(); f.type = ftype; f.frequency.value = freq; if (q) f.Q.value = q;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(dest || audio.out); src.start(t0); src.stop(t0 + dur + 0.03); return f;
}
function filt(type, freq, q) { const f = audio.ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 1; f.connect(audio.out); return f; }
const SFX = { // desi street sounds
  horn(t) { const f = filt('lowpass', 1600, 2); for (const k of [0, 0.21]) { osc('square', 370, t + k, 0.17, 0.2, f, 330); osc('square', 466, t + k, 0.17, 0.14, f, 420); } }, // pom pom
  whistle(t) { // traffic police: treee-treeee
    for (const [k, d] of [[0, 0.26], [0.36, 0.55]]) {
      const o = osc('sine', 2850, t + k, d, 0.15);
      const l = audio.ac.createOscillator(), lg = audio.ac.createGain(); l.frequency.value = 34; lg.gain.value = 240;
      l.connect(lg); lg.connect(o.frequency); l.start(t + k); l.stop(t + k + d + 0.03);
    }
  },
  moo(t) { const f = filt('lowpass', 620, 5); f.frequency.setValueAtTime(380, t); f.frequency.linearRampToValueAtTime(900, t + 0.35); f.frequency.linearRampToValueAtTime(450, t + 1); osc('sawtooth', 150, t, 1.0, 0.28, f, 108); },
  bell(t) { for (const k of [0, 0.17]) { osc('sine', 2350, t + k, 0.42, 0.11); osc('sine', 3120, t + k, 0.3, 0.05); } }, // tring tring
  ching(t) { osc('triangle', 1320, t, 0.1, 0.18); osc('triangle', 1980, t + 0.07, 0.38, 0.16); osc('sine', 2640, t + 0.07, 0.3, 0.05); },
  crash(t) { noise(t, 0.5, 0.6, 'lowpass', 1300); osc('sine', 110, t, 0.38, 0.5, null, 38); noise(t + 0.03, 0.3, 0.22, 'highpass', 3200); },
  beep(t) { osc('square', 820, t, 0.09, 0.07); osc('square', 820, t + 0.14, 0.09, 0.07); }, // tempo
  busHorn(t) { const f = filt('lowpass', 900, 1); osc('sawtooth', 196, t, 0.6, 0.14, f); osc('sawtooth', 247, t, 0.6, 0.11, f); },
  whoosh(t) { const f = noise(t, 0.14, 0.1, 'bandpass', 800, null, 1.4); f.frequency.exponentialRampToValueAtTime(2400, t + 0.13); },
  near(t) { osc('sine', 760, t, 0.14, 0.07, null, 1500); },
  dha(t) { osc('sine', 128, t, 0.26, 0.5, audio.music, 52); noise(t, 0.05, 0.14, 'bandpass', 1400, audio.music, 2); },
  ti(t) { noise(t, 0.05, 0.16, 'highpass', 5200, audio.music); },
  tak(t) { osc('triangle', 520, t, 0.08, 0.15, audio.music, 360); },
  escape(t) { [659, 784, 988, 1319].forEach((f, i) => osc('triangle', f, t + i * 0.09, 0.22, 0.13)); },
  over(t) { [523, 440, 349, 262].forEach((f, i) => osc('triangle', f, t + i * 0.17, 0.28, 0.17)); },
  record(t) { [523, 659, 784, 1047, 1319].forEach((f, i) => osc('triangle', f, t + 0.7 + i * 0.1, 0.3, 0.15)); },
};
function sfx(name) { if (!audio || muted) return; try { SFX[name](audio.ac.currentTime); } catch (e) { /* a mock context */ } }
function engine(level, v) {
  if (!audio) return;
  try {
    const t = audio.ac.currentTime;
    audio.eg.gain.setTargetAtTime(level * 0.05, t, 0.08); audio.lg.gain.setTargetAtTime(level * 0.05, t, 0.08);
    audio.eo.frequency.setTargetAtTime(44 + v * 1.1, t, 0.15); audio.lfo.frequency.setTargetAtTime(7 + v * 0.32, t, 0.15);
  } catch (e) { /* a mock context */ }
}
const BEAT = 'D.tkD.t.DktkD.tk'; // dhol pattern in eighths: D dha (bass), t ti, k tak

// ---- World and projection ---------------------------------------------------------------
// Road units: 1 = one lane. Lanes sit at x = -1, 0, 1. The camera is PZ units behind the rickshaw.
const HOR = 500, PZ = 4, NEAR = 1.4, FAR = 150, SEG = 2, HC = 2392, K0 = 920;
let K = K0;
function curvePx(z) { return state.curve * 0.012 * Math.max(0, z - PZ) * Math.max(0, z - PZ); }
function proj(X, Y, z) { const k = K / z; return { x: W / 2 + curvePx(z) + (X - state.camX) * k, y: HOR + HC / z - Y * k, s: k }; }
const KINDS = {
  cow: { w: 0.42, len: 0.5, hazard: true },
  cycle: { w: 0.22, len: 0.4, hazard: true, speed: 'cycleSpeed' },
  tempo: { w: 0.4, len: 0.6, hazard: true, speed: 'tempoSpeed' },
  bus: { w: 0.95, len: 1.2, hazard: true, speed: 'busSpeed' },
  passenger: { w: 0.32, len: 0.4, hazard: false },
};
const SHOPS = ['TEA', 'SNACKS', 'SWEETS', 'MOBILE', 'DINER', 'GROCERY', 'TAILOR', 'JUICE', 'BAKERY', 'CAFE', 'STD PCO', 'BANGLES'];
const WALLS = ['#d9799b', '#3fb6a8', '#e0a73a', '#9b7fd4', '#e86b4f', '#5d9fe0', '#c7c24a'];
const SIGNS = ['#ffd23f', '#ff3d8b', '#2de38a', '#29c5ff', '#ff7a1a', '#ffffff'];
const BEADS = ['#ff3d8b', '#ffd23f', '#2de38a', '#29c5ff', '#ff7a1a'];
const RIDERS = ['#ff3d8b', '#e9f0ff', '#ffd23f'];
const PICKUP_LINES = ['To the station, please!', 'Old market, please!', 'Hurry up, driver!', 'Use the meter!', 'Vegetable market!', 'Bus stand, quick!', 'How much, driver?'];
const NEAR_LINES = ['Close call!', 'Nice driving!', 'What a move!'];

// ---- Scenes ---------------------------------------------------------------------------
let scene, state, at = 0; // at: animation time, every scene
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = {
    t: 0, score: 0, gained: '', dist: 0, v: tune.baseSpeed, lane: 0, px: 0, camX: 0, tilt: 0, sway: 0,
    passengers: 0, mult: 1, objs: [], nextRowZ: 34, chase: false, chaseT: 0, invuln: 0, crashes: 0,
    policeShow: 0, polX: 190, popups: [], parts: [], shake: 0, flash: 0, forcedCow: false, forcedPair: false,
    beatPh: 0, beatIdx: 0, nearCd: 0, sndCd: {}, overT: 0, newBest: false, aboard: [], curve: 0,
    honkCd: 0, whistleT: 0, dustT: 0, nearMisses: 0,
  };
}
function popup(str, x, y, color = '#ffd23f', size = 40, life = 1.3) { state.popups.push({ str, x, y, color, size, life, t: 0 }); }
function burst(x, y, n, kind) {
  for (let i = 0; i < n; i++) {
    const a = vr() * Math.PI * 2, sp = 150 + vr() * 380;
    state.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 260, life: 0.9 + vr() * 0.7, t: 0, kind,
      c: kind === 'petal' ? (vr() < 0.5 ? '#ff9f1a' : '#ffd23f') : BEADS[Math.floor(vr() * 5)], rot: vr() * 6, vrot: (vr() - 0.5) * 14, sz: 8 + vr() * 9 });
  }
}

// Fair rows: a new hazard may only go where, at its arrival time, at least one lane stays open.
function blockedAt(ta) {
  const bl = [false, false, false];
  for (const o of state.objs) {
    if (!KINDS[o.kind].hazard || o.dead) continue;
    const rel = o.z - state.dist, close = Math.max(0.5, state.v - o.v), to = rel / close;
    if (Math.abs(to - ta) < tune.fairWindow) for (const L of o.lanes) bl[L + 1] = true;
  }
  return bl;
}
function arrival(kind, z) { const sp = KINDS[kind].speed ? tune[KINDS[kind].speed] : 0; return (z - state.dist) / Math.max(0.5, state.v - sp); }
function canPlace(kind, lanes, z) {
  const bl = blockedAt(arrival(kind, z));
  for (const L of lanes) { if (bl[L + 1]) return false; bl[L + 1] = true; }
  return bl.includes(false);
}
function addObj(kind, x, z, lanes, extra) {
  const k = KINDS[kind];
  const o = Object.assign({ kind, x, z, lanes, v: k.speed ? tune[k.speed] : 0, w: k.w, len: k.len, dir: rng() < 0.5 ? -1 : 1,
    var: Math.floor(rng() * 3), ph: rng() * 6, dead: false, passed: false, sounded: false, fly: 0 }, extra || {});
  state.objs.push(o); return o;
}
function tryHazard(kind, lane, z, diff) {
  if (kind === 'bus') {
    const pair = lane < 0 ? [-1, 0] : [0, 1];
    if (!canPlace('bus', pair, z)) return false;
    addObj('bus', lane < 0 ? -0.5 : 0.5, z, pair); return true;
  }
  if (!canPlace(kind, [lane], z)) return false;
  if (kind === 'tempo' && rng() < tune.laneChangeChance + 0.4 * diff) {
    const to = lane + (lane === -1 ? 1 : lane === 1 ? -1 : (rng() < 0.5 ? -1 : 1));
    if (canPlace('tempo', [lane, to], z)) { addObj('tempo', lane, z, [lane, to], { shiftTo: to }); return true; }
  }
  if (kind === 'cow' && diff > 0.15 && rng() < tune.cowWanderChance) {
    const to = lane + (lane === -1 ? 1 : lane === 1 ? -1 : (rng() < 0.5 ? -1 : 1));
    if (canPlace('cow', [lane, to], z)) { addObj('cow', lane, z, [lane, to], { wanderTo: to, dir: Math.sign(to - lane) }); return true; }
  }
  addObj(kind, lane, z, [lane]); return true;
}
function shuffledLanes() { const l = [-1, 0, 1]; for (let i = 2; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [l[i], l[j]] = [l[j], l[i]]; } return l; }
function pickKind(phaseT) {
  const r = rng();
  if (phaseT < tune.firstTroubleTime) return r < 0.6 ? 'cow' : 'cycle';
  return r < 0.32 ? 'cow' : r < 0.58 ? 'cycle' : 'tempo';
}
function spawnRow() {
  const z = state.nextRowZ, tr = (z - state.dist) / state.v, phaseT = state.t + tr;
  const diff = clamp((phaseT - tune.firstTroubleTime) / tune.rampTime, 0, 1);
  const used = new Set();
  let rowTime = lerp(tune.rowTimeStart, tune.rowTimeEnd, diff);
  if (phaseT < tune.safeTime) {
    if (rng() < 0.7) { const L = shuffledLanes()[0]; addObj('passenger', L, z, [L]); }
    rowTime *= 1.3;
  } else if (!state.forcedCow) { // the first hazard: a cow in the middle lane, a passenger beside it
    state.forcedCow = true; tryHazard('cow', 0, z, 0); used.add(0);
    const L = rng() < 0.5 ? -1 : 1; addObj('passenger', L, z + 3, [L]);
  } else if (phaseT >= tune.firstTroubleTime && !state.forcedPair) { // first real trouble: cycle and tempo together
    state.forcedPair = true;
    const lanes = shuffledLanes();
    if (tryHazard('cycle', lanes[0], z, 0)) used.add(lanes[0]);
    if (tryHazard('tempo', lanes[1], z, 0)) used.add(lanes[1]);
  } else {
    const lanes = shuffledLanes();
    if (phaseT > tune.firstTroubleTime + 8 && rng() < tune.busChance + 0.12 * diff) {
      const L = rng() < 0.5 ? -1 : 1;
      if (tryHazard('bus', L, z, diff)) { used.add(L); used.add(0); }
    }
    if (!used.size) {
      const dbl = phaseT >= tune.firstTroubleTime && rng() < lerp(tune.doubleChance, tune.doubleChanceMax, diff);
      const n = dbl ? 2 : 1;
      for (const L of lanes) { if (used.size >= n) break; if (tryHazard(pickKind(phaseT), L, z, diff)) used.add(L); }
    }
  }
  if (phaseT >= tune.safeTime && state.forcedCow && rng() < tune.passengerChance) {
    const free = shuffledLanes().filter(L => !used.has(L));
    if (free.length) addObj('passenger', free[0], z + (rng() < 0.5 ? 0 : 4), [free[0]]);
  }
  state.nextRowZ += state.v * rowTime;
}

function crash(o) {

  limb(-0.22, -1.15, -0.36, -0.8, '#c8a86a', 0.07);
  const lift = Math.sin(t * 9) * 0.08;
  limb(0.22, -1.15, 0.42, -1.38 + lift, '#c8a86a', 0.07);
  limb(0.42, -1.38 + lift, 0.66, -1.66 + lift * 1.5, '#a0522d', 0.045);
  ell(0.42, -1.38 + lift, 0.045, 0.045, '#b87a4b', true);
  ell(0, -1.35, 0.12, 0.13, '#b87a4b', true);
  ctx.beginPath(); ctx.moveTo(-0.07, -1.3); ctx.quadraticCurveTo(0, -1.27, 0.07, -1.3); ctx.lineTo(0.05, -1.26); ctx.quadraticCurveTo(0, -1.25, -0.05, -1.26); ctx.closePath(); ctx.fillStyle = '#1b1420'; ctx.fill();
  ell(-0.045, -1.38, 0.015, 0.015, INK); ell(0.045, -1.38, 0.015, 0.015, INK);
  rrp(-0.02, -1.27, 0.09, 0.035, 0.01); fs('#dfe6ee');
  ctx.beginPath(); ctx.moveTo(-0.15, -1.42); ctx.quadraticCurveTo(-0.16, -1.56, 0.02, -1.57); ctx.quadraticCurveTo(0.2, -1.55, 0.15, -1.42); ctx.closePath(); fs('#2b3a67');
  ctx.fillStyle = '#e0303a'; ctx.fillRect(-0.15, -1.45, 0.3, 0.035);
  ell(0.06, -1.5, 0.025, 0.025, '#ffd23f', true);
  ctx.restore();
}
function drawObj(o, z) {
  const p = proj(o.x, 0, z), s = p.s, a = fadeFor(z);
  if (a <= 0) return;
  ctx.globalAlpha = a;
  if (o.dead) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(o.fly * Math.min(1.2, o.ph * 0.15)); ctx.translate(-p.x, -p.y); }
  if (o.kind === 'cow') drawCow(p.x, p.y, s, o, at);
  else if (o.kind === 'cycle') drawCycle(p.x, p.y, s, o, at);
  else if (o.kind === 'tempo') drawTempo(p.x, p.y, s, o, at);
  else if (o.kind === 'bus') drawBus(p.x, p.y, s, o, at);
  else if (o.kind === 'passenger') {
    drawPassenger(p.x, p.y, s, o, at);
    const rel = z - PZ;
    if (rel < 30 && rel > 4) { // "Rickshaw!" bubble
      const bx = p.x, by = p.y - 1.15 * s - 26;
      ctx.lineWidth = 3; ctx.strokeStyle = INK; rrp(bx - 74, by - 20, 148, 40, 14); fs('#ffffff');
      ctx.beginPath(); ctx.moveTo(bx - 8, by + 19); ctx.lineTo(bx, by + 32); ctx.lineTo(bx + 8, by + 19); ctx.fillStyle = '#ffffff'; ctx.fill();
      otext('RICKSHAW!', bx, by, 22, '#c4123f', 'center', '#ffffff', 0.05);
    }
  }
  if (o.dead) ctx.restore();
  ctx.globalAlpha = 1;
}

function drawWorld(withPlayer) {
  const shx = state.shake > 0 ? (vr() - 0.5) * state.shake * 40 : 0, shy = state.shake > 0 ? (vr() - 0.5) * state.shake * 30 : 0;
  ctx.save(); ctx.translate(shx, shy);
  drawSky(); drawSkyline(); drawRoad();
  const camW = state.dist - PZ, items = [];
  for (const side of [-1, 1]) {
    for (let j = Math.floor(camW / 7) - 1; ; j++) {
      const zn = j * 7 + (side > 0 ? 3.5 : 0) - camW;
      if (zn > FAR) break; if (zn + 6.2 < NEAR) continue;
      items.push({ z: Math.max(zn, NEAR), d: () => drawBuilding(side, j * 2 + (side > 0 ? 1 : 0), zn) });
    }
    for (let j = Math.floor(camW / 16); ; j++) {
      const z = j * 16 + (side > 0 ? 8 : 0) - camW; if (z > FAR) break; if (z < NEAR) continue;
      items.push({ z, d: () => drawLamp(side, z) });
    }
  }
  for (let j = Math.floor(camW / 50); ; j++) { const z = j * 50 + 20 - camW; if (z > FAR) break; if (z < NEAR + 0.5) continue; items.push({ z, d: () => drawBunting(z, j) }); }
  for (const o of state.objs) { const z = o.z - state.dist + PZ; if (z > NEAR && z < FAR) items.push({ z, d: () => drawObj(o, z) }); }
  items.sort((a, b) => b.z - a.z);
  let i = 0;
  for (; i < items.length && items[i].z > PZ; i++) items[i].d();
  if (withPlayer) drawPlayer();
  for (; i < items.length; i++) items[i].d();
  if (withPlayer && state.policeShow > 0.01) {
    const tx = state.px >= 0.5 ? -200 : 200; state.polX += (tx - state.polX) * 0.08;
    const pp = proj(state.px, 0, PZ);
    drawPolice(pp.x + state.polX, H + 80 - state.policeShow * 280 + Math.sin(at * 14) * 3, 230, at);
  }
  for (const p of state.parts) {
    ctx.globalAlpha = clamp(1 - p.t / p.life, 0, 1);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    if (p.kind === 'petal') { ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * 0.55, 0, 0, Math.PI * 2); ctx.fillStyle = p.c; ctx.fill(); ctx.strokeStyle = '#c45a00'; ctx.lineWidth = 1.5; ctx.stroke(); }
    else if (p.kind === 'dust') { ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * 0.8, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(230,200,180,0.55)'; ctx.fill(); }
    else { ctx.fillStyle = p.c; ctx.fillRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.strokeRect(-p.sz / 2, -p.sz / 4, p.sz, p.sz / 2); }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // speed lines at the edges
  const sf = clamp((state.v - 24) / 20, 0, 1);
  if (sf > 0 && scene !== 'title') {
    ctx.strokeStyle = `rgba(255,255,255,${0.35 * sf})`; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let k = 0; k < 14; k++) {
      const side = k % 2 ? 1 : -1, ang = (hash(k) - 0.5) * 1.6, ph = (at * (2.2 + hash(k + 4)) + hash(k + 8)) % 1;
      const r0 = 340 + ph * 700, r1 = r0 + 60 + 140 * sf, cx = W / 2, cy = HOR;
      const dx = side * Math.cos(ang), dy = Math.abs(Math.sin(ang)) + 0.3;
      ctx.beginPath(); ctx.moveTo(cx + dx * r0, cy + dy * r0); ctx.lineTo(cx + dx * r1, cy + dy * r1); ctx.stroke();
    }
  }
  for (const p of state.popups) {
    const k = p.t / p.life, pop = Math.min(1, p.t / 0.12);
    ctx.globalAlpha = clamp(1.4 - k * 1.4, 0, 1);
    otext(p.str, p.x, p.y - k * 70, p.size * (0.6 + 0.4 * pop), p.color);
  }
  ctx.globalAlpha = 1;
  if (state.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${state.flash * 2.5})`; ctx.fillRect(0, 0, W, H); }
}
function drawPlayer() {
  const pp = proj(state.px, 0, PZ);
  const bounce = Math.abs(Math.sin(at * (8 + state.v * 0.25))) * -3;
  if (state.invuln > 0 && Math.floor(state.invuln * 10) % 2 === 0) ctx.globalAlpha = 0.45;
  drawRickshaw(pp.x, pp.y + bounce, pp.s, { t: at, tilt: state.tilt + (state.lane - state.px) * 0.12, sway: state.sway + (state.lane - state.px) * 0.8, aboard: state.aboard });
  ctx.globalAlpha = 1;
  // exhaust and dust
  state.dustT -= STEP;
  if (state.dustT <= 0 && scene !== 'over' && scene !== 'pause') {
    state.dustT = 0.06;
    for (const sx of [-0.38, 0.38]) state.parts.push({ x: pp.x + sx * pp.s, y: pp.y - 8, vx: (vr() - 0.5) * 80, vy: -40 - vr() * 60, life: 0.5, t: 0, kind: 'dust', c: '', rot: 0, vrot: 0, sz: 7 + vr() * 8 });
  }
}

// ---- HUD and screens ----------------------------------------------------------------------
function truckStrip(y, h) {
  const n = Math.ceil(W / 30);
  for (let i = 0; i < n; i++) { ctx.fillStyle = BEADS[i % 5]; ctx.beginPath(); ctx.moveTo(i * 30, y); ctx.lineTo(i * 30 + 30, y); ctx.lineTo(i * 30 + 15, y + h); ctx.fill(); }
}
function drawButton(b) {
  ctx.lineWidth = 4; ctx.strokeStyle = INK;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(42,15,58,0.85)'; ctx.fill(); ctx.strokeStyle = '#ffd23f'; ctx.stroke();
  ctx.fillStyle = '#ffffff';
  if (b.kind === 'pause') { ctx.fillRect(b.x - 11, b.y - 13, 8, 26); ctx.fillRect(b.x + 3, b.y - 13, 8, 26); }
  else if (b.kind === 'play') { ctx.beginPath(); ctx.moveTo(b.x - 8, b.y - 14); ctx.lineTo(b.x + 13, b.y); ctx.lineTo(b.x - 8, b.y + 14); ctx.closePath(); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.moveTo(b.x - 15, b.y - 6); ctx.lineTo(b.x - 7, b.y - 6); ctx.lineTo(b.x + 3, b.y - 15); ctx.lineTo(b.x + 3, b.y + 15); ctx.lineTo(b.x - 7, b.y + 6); ctx.lineTo(b.x - 15, b.y + 6); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    if (muted) { line(b.x + 8, b.y - 7, b.x + 18, b.y + 7, '#ff5a5a', 4); line(b.x + 18, b.y - 7, b.x + 8, b.y + 7, '#ff5a5a', 4); }
    else { ctx.beginPath(); ctx.arc(b.x + 4, b.y, 9, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(b.x + 4, b.y, 15, -0.8, 0.8); ctx.stroke(); }
  }
}
function drawRiderIcon(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineWidth = 0.06; ctx.strokeStyle = INK;
  rrp(-0.28, -0.1, 0.56, 0.42, 0.14); fs('#ffd23f');
  ell(0, -0.32, 0.18, 0.2, '#c98b5a', true);
  ctx.beginPath(); ctx.ellipse(0, -0.38, 0.19, 0.12, 0, Math.PI, 0); ctx.fillStyle = '#1b1420'; ctx.fill();
  ctx.restore();
}
function drawHUD() {
  const g = ctx.createLinearGradient(0, 0, 0, 150);
  g.addColorStop(0, 'rgba(27,10,46,0.85)'); g.addColorStop(1, 'rgba(27,10,46,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 150);
  truckStrip(0, 12);
  otext(Math.floor(state.score).toLocaleString('en-IN'), W / 2, 60, 54, '#ffd23f');
  otext(Math.floor(state.dist) + ' m', W / 2, 106, 26, '#ffffff');
  drawRiderIcon(42, 62, 46);
  otext('x ' + state.passengers, 74, 60, 32, '#ffffff', 'left');
  otext('Multi x' + state.mult.toFixed(1), 24, 106, 24, '#2de38a', 'left');
  otext(Math.round(state.v * 3.6) + ' km/h', W - 24, 112, 24, '#29c5ff', 'right');
  for (const b of buttons()) drawButton(b);
  if (state.chase && scene !== 'over') {
    const on = Math.floor(at * 6) % 2 === 0;
    ctx.fillStyle = on ? 'rgba(220,30,50,0.88)' : 'rgba(40,70,220,0.88)'; ctx.fillRect(0, 146, W, 64);
    truckStrip(146, 8);
    otext('POLICE ON YOUR TAIL!', W / 2, 176, 34, '#ffffff');
    const k = clamp(state.chaseT / tune.chaseTime, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(60, 214, W - 120, 14);
    ctx.fillStyle = '#ffd23f'; ctx.fillRect(60, 214, (W - 120) * (1 - k), 14);
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(60, 214, W - 120, 14);
    otext('Drive clean to escape: ' + Math.ceil(state.chaseT) + 's', W / 2, 252, 26, '#ffffff');
  }
  if (state.t < 6 && scene === 'play') { // the swipe hint, taught in the first seconds
    const a = clamp(1 - (state.t - 4.5) / 1.5, 0, 1), sl = Math.sin(at * 6) * 16;
    ctx.globalAlpha = a;
    otext('SWIPE', W / 2, 400, 40, '#ffffff');
    for (const sd of [-1, 1]) {
      const cx = W / 2 + sd * (190 + sl);
      ctx.beginPath(); ctx.moveTo(cx + sd * 26, 400); ctx.lineTo(cx - sd * 10, 376); ctx.lineTo(cx - sd * 10, 424); ctx.closePath();
      ctx.fillStyle = '#ffd23f'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();
    }
    otext('Pick up riders, dodge the cows', W / 2, 452, 26, '#ffd23f');
    ctx.globalAlpha = 1;
  }
}
function drawLogo(cx, cy, t) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.05 + Math.sin(t * 1.5) * 0.015);
  rrp(-300, -150, 600, 270, 30); ctx.fillStyle = 'rgba(42,15,58,0.78)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#ffd23f'; ctx.stroke();
  for (let i = 0; i < 20; i++) { ctx.fillStyle = BEADS[i % 5]; const x0 = -300 + i * 30; ctx.beginPath(); ctx.moveTo(x0, -150); ctx.lineTo(x0 + 30, -150); ctx.lineTo(x0 + 15, -128); ctx.fill(); ctx.beginPath(); ctx.moveTo(x0, 120); ctx.lineTo(x0 + 30, 120); ctx.lineTo(x0 + 15, 98); ctx.fill(); }
  for (const [fx, fy] of [[-262, -88], [262, -88], [-262, 60], [262, 60]]) drawFlower(fx, fy, 12, '#ff3d8b', '#ffd23f');
  const grd = ctx.createLinearGradient(0, -100, 0, 0); grd.addColorStop(0, '#fff3a8'); grd.addColorStop(1, '#ffb020');
  otext('RICKSHAW', 0, -52, 92, grd, 'center', INK, 0.2);
  const g2 = ctx.createLinearGradient(0, 10, 0, 80); g2.addColorStop(0, '#ff7ab8'); g2.addColorStop(1, '#ff2d7a');
  otext('RUSH', 0, 44, 104, g2, 'center', INK, 0.2);
  ctx.restore();
}
function drawTitle() {
  drawWorld(true);
  ctx.fillStyle = 'rgba(27,10,46,0.35)'; ctx.fillRect(0, 0, W, H);
  drawLogo(W / 2, 250, at);
  const p = 0.85 + 0.15 * Math.sin(at * 5);
  otext('TAP TO RIDE!', W / 2, 500, 50 * p, '#ffffff', 'center', '#c4123f', 0.22);
  CONTROLS.forEach((c, i) => otext(c, W / 2, 590 + i * 44, 25, '#ffe9b0'));
  if (best > 0) otext('Best: ' + best.toLocaleString('en-IN'), W / 2, 740, 32, '#2de38a');
  if (at % 3 < 0.6) otext('HONK HONK!', W / 2 + 150, 880, 32, '#ffffff');
  drawButton(buttons()[0]);
  truckStrip(H - 14, 14);
}
function drawOver() {
  ctx.fillStyle = 'rgba(27,10,46,0.55)'; ctx.fillRect(0, 0, W, H);
  const k = clamp(state.overT / 0.35, 0, 1), y0 = 250 + (1 - k) * 200;
  ctx.globalAlpha = k;
  rrp(60, y0, W - 120, 560, 30); ctx.fillStyle = 'rgba(42,15,58,0.95)'; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = '#ffd23f'; ctx.stroke();
  for (let i = 0; i < 20; i++) { ctx.fillStyle = BEADS[i % 5]; const x0 = 66 + i * 29.4; ctx.beginPath(); ctx.moveTo(x0, y0 + 4); ctx.lineTo(x0 + 29.4, y0 + 4); ctx.lineTo(x0 + 14.7, y0 + 24); ctx.fill(); }
  otext('BUSTED BY', W / 2, y0 + 78, 56, '#ff5a5a');
  otext('THE POLICE!', W / 2, y0 + 138, 56, '#ff5a5a');
  otext('Score', W / 2, y0 + 210, 28, '#ffe9b0');
  otext(Math.floor(state.score).toLocaleString('en-IN'), W / 2, y0 + 262, 72, '#ffd23f');
  if (state.newBest) { const b = 1 + Math.sin(at * 8) * 0.06; otext('NEW RECORD!', W / 2, y0 + 326, 38 * b, '#2de38a'); }
  else otext('Best: ' + best.toLocaleString('en-IN'), W / 2, y0 + 326, 32, '#2de38a');
  otext('Distance: ' + Math.floor(state.dist) + ' m', W / 2, y0 + 384, 30, '#ffffff');
  otext('Riders: ' + state.passengers + '   ·   Close calls: ' + state.nearMisses, W / 2, y0 + 428, 26, '#ffffff');
  if (state.overT > 0.6) { const p = 0.9 + 0.1 * Math.sin(at * 6); otext('TAP TO RIDE AGAIN', W / 2, y0 + 500, 34 * p, '#ffffff', 'center', '#c4123f', 0.22); }
  ctx.globalAlpha = 1;
}
function drawFigures() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#9c2f7a'); g.addColorStop(1, '#3a2450');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  otext('Rickshaw Rush: figures', W / 2, 50, 34, '#ffd23f');
  const t = state.t + 0.5;
  const cell = [[180, 380], [540, 380], [180, 760], [540, 760], [360, 1140]];
  drawRickshaw(cell[0][0], cell[0][1], 230, { t, tilt: 0, sway: 0, aboard: [0, 1, 2] }); otext('Rickshaw (you)', cell[0][0], cell[0][1] + 34, 26, '#ffffff');
  drawCow(cell[1][0], cell[1][1], 230, { dir: -1, ph: 0 }, t); otext('Cow', cell[1][0], cell[1][1] + 34, 26, '#ffffff');
  drawCycle(110, 700, 210, { ph: 0 }, t); otext('Milkman cycle', 110, 734, 24, '#ffffff');
  drawTempo(300, 700, 190, { shiftTo: 1, x: 0 }, 0); otext('Tempo', 300, 734, 26, '#ffffff');
  drawBus(560, 700, 150, {}, t); otext('Bus (2 lanes)', 560, 734, 26, '#ffffff');
  drawPassenger(110, 1090, 230, { var: 0, ph: 0 }, t); drawPassenger(230, 1090, 230, { var: 1, ph: 1 }, t); drawPassenger(350, 1090, 230, { var: 2, ph: 2 }, t);
  otext('Riders', 230, 1124, 26, '#ffffff');
  drawPolice(570, 1150, 200, 0.05); otext('Traffic police', 570, 1180, 26, '#ffffff');
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  at += STEP;
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { ctx.setTransform(...baseTransform); scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
